<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile Pattern Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEBE4;color:#1D1D1B;font-family:'Familjen Grotesk',sans-serif}
</style>
</helmet>
<div style="width: 1440px; height: 2080px; box-sizing: border-box; padding: 56px 60px; background: #EFEBE4; color: #1D1D1B; font-family: 'Familjen Grotesk', sans-serif; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -0.04em">Tile pattern library</h1>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em">7 PAGES × 3 PATTERNS</span>
</div>
<sc-for list="{{topics}}" as="t" hint-placeholder-count="6">
<section style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{t.dot}}"></span>{{t.label}}</div>
<div style="display: grid; grid-template-columns: repeat(3, 400px); column-gap: 60px; row-gap: 24px">
<sc-for list="{{t.comps}}" as="c" hint-placeholder-count="6">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="width: 400px; height: 200px; display: grid; grid-template-columns: repeat(10, 40px); grid-template-rows: repeat(5, 40px); overflow: hidden">
<sc-for list="{{c.tiles}}" as="x" hint-placeholder-count="50">
<div style="grid-column: {{x.col}}; grid-row: {{x.row}}; width: 40px; height: 40px; background: {{x.bg}}">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 120 120" style="display: block; transform: rotate({{x.rot}}deg)">
<g style="transform: scale({{x.sc}}); transform-origin: 60px 60px">
<path d="{{x.a}}" fill="{{x.fg}}" fill-rule="evenodd"></path>
<path d="{{x.b}}" fill="{{x.fg2}}" fill-rule="evenodd"></path>
<path d="{{x.st}}" fill="none" stroke="{{x.fg}}" stroke-width="16"></path>
</g>
</svg>
</div>
</sc-for>
</div>
<figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 12px">{{c.name}}</figcaption>
</figure>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>

          { name: 'Moons', f: function (r, c) { var dk = ((r >> 1) + (c >> 1)) % 2; return { k: 'moon', rot: ((r + c) % 4) * 90, bg: dk ? '#111111' : '#FFFFFF', fg: dk ? '#C7F03A' : '#111111' }; } }
        ] },
      { id: 'contact', label: 'Contact', title: 'Contact', kicker: 'Because it is and always will be about people', bg: function () { return CT.terra; }, fgc: '#1D1D1B', dot: function () { return CT.terra; },
        body: '[your@email.com] · GitHub · LinkedIn · X', href: '#', link: '[EMAIL ME] ↗', linkShort: '[your@email.com]',
        comps: [
          { name: 'Pulse', auto: 'pulse', f: function (r, c) { return { k: 'dot', rot: 0, bg: (r + c) % 2 ? CT.off : CT.blush, fg: CT.terra, d: Math.hypot(c - 13.5, r - 8) }; } },
          { name: 'Speech', f: function () { var bg = pick([CT.blush, CT.off, CT.off]); return { k: 'halves', rot: Math.random() < 0.5 ? 0 : 90, bg: bg, fg: bg === CT.blush ? CT.terra : pick([CT.terra, CT.ink]), fg2: bg === CT.blush ? CT.ink : CT.terra }; } },
          { name: 'Confetti', f: function () { var L = [CT.terra, CT.blush, CT.ink, CT.yel], bg = pick([CT.off, CT.off, CT.blush]), fg; do { fg = pick(L); } while (fg === bg); return { k: pick(['dots4', 'diamond', 'half', 'dot']), rot: r4(), bg: bg, fg: fg, fg2: bg }; } }
        ] },
      { id: 'community', label: 'Community', title: 'Community', kicker: 'Leave your mark', bg: function () { return '#E9B8A6'; }, fgc: '#1D1D1B', dot: function () { return '#E9B8A6'; },
        body: '', href: '', link: '', linkShort: '',
        comps: [ { name: 'Community', f: function () { return { k: 'none', rot: 0, bg: '#EFEBE4', fg: '#1D1D1B' }; } } ] }
    ];
    this.CS = 90;
    this.PANEL = { small: { c: 11, r: 6, w: 5, h: 4 }, big: { c: 10, r: 5, w: 6, h: 5 } };
    this.LISTS = {
      education: { label: 'STUDIES', rows: [
        { lead: '01', title: 'TU Munich', sub: 'B.Sc. Informatik', meta: '[YYYY–YYYY]', href: '#' },
        { lead: '02', title: 'CSEE', sub: '[Programme]', meta: '[YYYY]', href: '#' },
        { lead: '03', title: 'UC Berkeley', sub: '[Programme]', meta: '[YYYY]', href: '#' },
        { lead: '04', title: 'HFPH', sub: 'Philosophy', meta: '[YYYY]', href: '#' }
      ] },
      projects: { label: 'SELECTED PROJECTS', rows: [
        { lead: '01', title: '[Project one]', sub: '[What it is]', meta: '[YYYY] ↗', href: '#' },
        { lead: '02', title: '[Project two]', sub: '[What it is]', meta: '[YYYY] ↗', href: '#' },
        { lead: '03', title: '[Project three]', sub: '[What it is]', meta: '[YYYY] ↗', href: '#' }
      ] },
      music: { label: 'TOP 3 THIS WEEK · VIA SPOTIFY', rows: [
        { cover: '#FF6A13', cover2: '#1D1D1B', title: '[Track title]', sub: '[Artist]', meta: '01', href: '#' },
        { cover: '#F7C7A6', cover2: '#9C3A12', title: '[Track title]', sub: '[Artist]', meta: '02', href: '#' },
        { cover: '#1D1D1B', cover2: '#FF6A13', title: '[Track title]', sub: '[Artist]', meta: '03', href: '#' }
      ] }
    };
    this.BR = { motifs: ['qdisc', 'half', 'tri', 'dot', 'qring', 'leaf', 'squares', 'arc'], colors: ['#E2573B', '#2F4FD8', '#F2C14E', '#9DB39A', '#1D1D1B', '#E9B8A6', '#EFEBE4'] };
    this.brush = { k: 'qdisc', fg: '#E2573B', bg: '#EFEBE4' };
    this.form = { name: '', note: '' };
    this.editing = false; this.entryIdx = 0;
    this.NR = 10; this.NC = 16;
    this.cells = [];
    for (var r = 0; r < 5; r++) for (var c = 0; c < 10; c++) this.cells.push([r, c]);
    var M = this.M, cells = this.cells;
    this.lib = this.T.filter(function (t) { return t.id !== 'community'; }).map(function (t) {
      return { label: t.label.toUpperCase(), dot: t.bg(), comps: t.comps.map(function (cp, ci) {
        var S = {};
        return { name: (ci + 1) + ' · ' + cp.name, tiles: cells.map(function (rc) { var x = cp.f(rc[0] + 5, rc[1] + 6, S), m = M[x.k]; return { col: String(rc[1] + 1), row: String(rc[0] + 1), bg: x.bg, fg: x.fg, fg2: x.fg2 || x.fg, a: x.a || m.a || '', b: x.b || m.b || '', st: x.st || m.st || '', rot: x.rot, sc: x.sc || (x.k === 'dot' ? (0.25 + 0.75 * (0.5 + 0.5 * Math.sin((x.d || 0) * 1.1))).toFixed(2) : 1) }; }) };
      }) };
    });
  }
  bars() { var d = ''; for (var i = 0; i < 4; i++) { var h = Math.round(14 + Math.random() * 86); d += 'M' + (12 + i * 26) + ' ' + (108 - h) + 'h18v' + h + 'h-18z'; } return d; }
  wheel(dy) {
    var now = performance.now();
    if (this.trans || now < (this.lockUntil || 0)) { this.acc = 0; return; }
    if (now - (this.lastWheel || 0) > 260) this.acc = 0;
    this.lastWheel = now;
    this.acc = (this.acc || 0) + dy;
    if (Math.abs(this.acc) < 70) return;
    var dir = this.acc > 0 ? 1 : -1, n = this.T[this.topic].comps.length;
    this.acc = 0;
    this.lockUntil = now + 1150;
    if (this.isComm()) { if (this.editing) return; var m = this.entries.length; this.entryIdx = (this.entryIdx + dir + m) % m; this.go(this.topic, 0, dir > 0 ? [0, 0] : [9, 15]); return; }
    this.go(this.topic, (this.comp + dir + n) % n, dir > 0 ? [0, 0] : [9, 15]);
  }
  panelRect() { return this.PANEL.small; }
  mix(a, b, t) { var p = function (h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }; var x = p(a), y = p(b); return '#' + [0, 1, 2].map(function (i) { return Math.round(x[i] + (y[i] - x[i]) * t).toString(16).padStart(2, '0'); }).join(''); }
  dp() { var b = this.props.dryftBlue ?? '#1F3DFF'; return { blue: b, deep: this.mix(b, '#0B0D1A', 0.62), tint: this.mix(b, '#EFEBE4', 0.72), off: '#EFEBE4' }; }
  loadEntries() {
    var saved = [];
    try { var raw = window.localStorage.getItem('mvs-community-v1'); if (raw) saved = JSON.parse(raw) || []; } catch (e) { saved = []; }
    var self = this, seeds = [0, 1, 2].map(function (ci) {
      var f = self.T[0].comps[ci].f, S = {};
      return { name: '[Sample visitor]', note: '[A short note a visitor left with their pattern.]', date: '[Date]', sample: true,
        tiles: self.cells.map(function (rc) { var t = f(rc[0], rc[1], S); return { k: t.k, rot: t.rot, bg: t.bg, fg: t.fg, fg2: t.fg2 || t.fg }; }) };
    });
    return saved.concat(seeds);
  }
  saveEntries() { try { window.localStorage.setItem('mvs-community-v1', JSON.stringify(this.entries.filter(function (e) { return !e.sample; }))); } catch (e) {} }
  isComm() { return this.T[this.topic].id === 'community'; }
  buildCommunity() {
    var M = this.M, src = this.editing ? this.canvas : (this.entries[this.entryIdx] || this.entries[0]).tiles, cells = this.cells;
    return cells.map(function (rc, i) {
      var t = src[i] || { k: 'none', rot: 0, bg: '#EFEBE4', fg: '#1D1D1B' }, m = M[t.k] || {};
      return { r: rc[0], c: rc[1], k: t.k, rot: t.rot, bg: t.bg, fg: t.fg, fg2: t.fg2 || t.fg, a: m.a || '', b: m.b || '', st: m.st || '', sc: 1, s: 1 };
    });
  }
  paint(i) {
    if (!this.isComm() || !this.editing || this.trans) return;
    var t = this.tiles[i], b = this.brush, m = this.M[b.k] || {}, cv = this.canvas[i];
    if (cv.k === b.k && cv.fg === b.fg && cv.bg === b.bg) { cv.rot += 90; t.rot = cv.rot; }
    else { cv.k = b.k; cv.fg = b.fg; cv.fg2 = b.fg; cv.bg = b.bg; t.k = b.k; t.fg = b.fg; t.fg2 = b.fg; t.bg = b.bg; t.a = m.a || ''; t.b = m.b || ''; t.st = m.st || ''; }
    this.forceUpdate();
  }
  startMark() {
    this.editing = true; this.form = { name: '', note: '' }; this.noteErr = false;
    if (this.nameEl) this.nameEl.value = ''; if (this.noteEl) this.noteEl.value = '';
    this.canvas = this.cells.map(function () { return { k: 'none', rot: 0, bg: '#EFEBE4', fg: '#1D1D1B', fg2: '#1D1D1B' }; });
    this.go(this.topic, 0, [9, 15]);
  }
  cancelMark() { this.editing = false; this.go(this.topic, 0, [9, 15]); }
  submitMark() {
    var name = (this.nameEl ? this.nameEl.value : this.form.name) || '', note = ((this.noteEl ? this.noteEl.value : this.form.note) || '').trim();
    this.form = { name: name, note: note };
    if (!note) { this.noteErr = true; if (this.noteEl) this.noteEl.focus(); this.forceUpdate(); return; }
    this.noteErr = false;
    var d = new Date(), date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    this.entries.unshift({ name: name.trim() || 'Anonymous', note: note, date: date, tiles: this.canvas.map(function (t) { return { k: t.k, rot: t.rot, bg: t.bg, fg: t.fg, fg2: t.fg2 }; }) });
    this.saveEntries();
    this.entryIdx = 0; this.editing = false;
    this.go(this.topic, 0, [0, 0]);
  }
  renderVals() {
    this.setup();
    return { topics: this.lib };
  }
}
