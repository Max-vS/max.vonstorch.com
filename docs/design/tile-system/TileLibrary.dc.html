<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile Pattern Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEBE4;color:#1D1D1B;font-family:'Familjen Grotesk',sans-serif}
</style>
</helmet>
<div style="width: 1440px; height: 2200px; box-sizing: border-box; padding: 56px 60px; background: #EFEBE4; color: #1D1D1B; font-family: 'Familjen Grotesk', sans-serif; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -0.04em">Tile pattern library</h1>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em">7 PAGES × 3 PATTERNS</span>
</div>
<sc-for list="{{topics}}" as="t" hint-placeholder-count="6">
<section style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{t.dot}}"></span>{{t.label}}</div>
<div style="display: grid; grid-template-columns: repeat(3, 400px); column-gap: 60px; row-gap: 24px">
<sc-for list="{{t.comps}}" as="c" hint-placeholder-count="6">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="width: 400px; height: 200px; display: grid; grid-template-columns: repeat(10, 40px); grid-template-rows: repeat(5, 40px); overflow: hidden">
<sc-for list="{{c.tiles}}" as="x" hint-placeholder-count="50">
<div style="grid-column: {{x.col}}; grid-row: {{x.row}}; width: 40px; height: 40px">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 120 120" style="display: block; transform: rotate({{x.rot}}deg) scale(1.035)"><rect width="120" height="120" fill="{{x.bg}}"></rect>
<g style="transform: scale({{x.sc}}); transform-origin: 60px 60px">
<path d="{{x.a}}" fill="{{x.fg}}" fill-rule="evenodd"></path>
<path d="{{x.b}}" fill="{{x.fg2}}" fill-rule="evenodd"></path>
<path d="{{x.st}}" fill="none" stroke="{{x.fg}}" stroke-width="16"></path>
</g>
</svg>
</div>
</sc-for>
</div>
<figcaption style="font-family: 'JetBrains Mono', monospace; font-size: 12px">{{c.name}}</figcaption>
</figure>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
