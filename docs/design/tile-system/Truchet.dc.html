<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>23 — Tile System v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEBE4;color:#1D1D1B;font-family:'Familjen Grotesk',sans-serif}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:4px}
.tt-flip{transition:transform .26s cubic-bezier(.5,0,.5,1)}
.tt-rot{transition:transform .7s cubic-bezier(.65,0,.25,1)}
.tt-sc{transition:transform .5s cubic-bezier(.4,0,.2,1)}
.tt-blk{transition:background .6s cubic-bezier(.65,0,.25,1), color .6s}
.tt-panel{transition:left .75s cubic-bezier(.65,0,.25,1),top .75s cubic-bezier(.65,0,.25,1),width .75s cubic-bezier(.65,0,.25,1),height .75s cubic-bezier(.65,0,.25,1)}
.tt-row{transition:padding .3s cubic-bezier(.19,.8,.12,1)}
.tt-row:hover{padding-left:8px !important;text-decoration:none !important}
.tt-nav{transition:background .25s,color .25s,border-color .25s}
.tt-nav:hover{color:#1D1D1B !important}
.tt-re{transition:transform .5s cubic-bezier(.65,0,.25,1),opacity .2s}
.tt-re:hover{transform:rotate(180deg)}
.tt-ext:hover{opacity:.6}
.tt-tick{transition:height .45s cubic-bezier(.65,0,.25,1),background .3s}
.tt-lnk{transition:opacity .2s}
.tt-lnk:hover{opacity:.6}
.tt-btn{transition:background .2s,color .2s}
.tt-btn:hover{background:#1D1D1B;color:#EFEBE4}
@media (prefers-reduced-motion: reduce){.tt-flip,.tt-rot,.tt-sc{transition:none}}
</style>
</helmet>
<div onWheel="{{onWheel}}" style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #EFEBE4; color: #1D1D1B; font-family: 'Familjen Grotesk', sans-serif; display: grid; grid-template-columns: repeat(16, 90px); grid-template-rows: repeat(10, 90px)">

<sc-for list="{{tiles}}" as="t" hint-placeholder-count="116">
<button type="button" tabindex="-1" aria-hidden="true" onMouseEnter="{{t.hit}}" onClick="{{t.paint}}" style="grid-column: {{t.col}}; grid-row: {{t.row}}; width: 90px; height: 90px; overflow: hidden; margin: 0; padding: 0; border: 0; background: transparent; cursor: {{t.cur}}">
<div class="tt-flip" style="width: 90px; height: 90px; background: {{t.bg}}; transform: scale({{t.s}}, 1)">
<svg aria-hidden="true" class="tt-rot" width="90" height="90" viewBox="0 0 120 120" style="display: block; transform: rotate({{t.rot}}deg)">
<g class="tt-sc" style="transform: scale({{t.sc}}); transform-origin: 60px 60px">
<path d="{{t.a}}" fill="{{t.fg}}" fill-rule="evenodd"></path>
<path d="{{t.b}}" fill="{{t.fg2}}" fill-rule="evenodd"></path>
<path d="{{t.st}}" fill="none" stroke="{{t.fg}}" stroke-width="16"></path>
</g>
</svg>
</div>
</button>
</sc-for>

<div class="tt-blk" style="grid-column: 1 / span 8; grid-row: 1 / span 3; background: {{titleBg}}; color: {{titleFg}}; box-sizing: border-box; padding: 26px 30px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; opacity: 0.8; text-transform: uppercase">{{kicker}}</span>
<sc-if value="{{isIndex}}" hint-placeholder-val="{{ true }}"><h1 style="margin: 0; font-size: 104px; line-height: 0.88; font-weight: 700; letter-spacing: -0.045em">Max von Storch</h1></sc-if>
<sc-if value="{{notIndex}}" hint-placeholder-val="{{ false }}"><h1 style="margin: 0; font-size: 132px; line-height: 0.85; font-weight: 700; letter-spacing: -0.05em">{{title}}</h1></sc-if>
</div>

<div class="tt-panel" style="position: absolute; left: {{px}}px; top: {{py}}px; width: {{pw}}px; height: {{ph}}px; background: #EFEBE4; box-sizing: border-box; padding: 26px 30px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<sc-if value="{{simple}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 500">{{body}}</p>
</sc-if>
<sc-if value="{{hasList}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; border-top: 1.5px solid #1D1D1B">
<sc-for list="{{rows}}" as="x" hint-placeholder-count="4">
<a href="{{x.href}}" class="tt-row" style="display: grid; grid-template-columns: {{x.cols}}; column-gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid rgba(29,29,27,0.18); text-decoration: none">
<sc-if value="{{x.hasCover}}" hint-placeholder-val="{{ false }}"><span style="width: 48px; height: 48px; background: {{x.cover}}; display: block; position: relative; overflow: hidden"><span style="position: absolute; left: 0; top: 0; width: 48px; height: 48px; border-radius: 0 0 100% 0; background: {{x.cover2}}"></span></span></sc-if>
<span style="display: flex; align-items: baseline; gap: 10px; min-width: 0; white-space: nowrap; overflow: hidden"><span style="font-size: 18px; font-weight: 600">{{x.title}}</span><span style="font-size: 15px; color: #6B665E; overflow: hidden; text-overflow: ellipsis">{{x.sub}}</span></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #6B665E; text-align: right; white-space: nowrap">{{x.meta}}</span>
</a>
</sc-for>
</div>
</sc-if>
<sc-if value="{{hasCta}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 14px"><a href="{{ctaHref}}" download="" class="tt-btn" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 18px; background: #1D1D1B; color: #EFEBE4; border: 1.5px solid #1D1D1B; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-decoration: none">{{ctaLabel}}</a><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.04em; color: #8A857C">{{ctaNote}}</span></div></sc-if>
<sc-if value="{{hasLink}}" hint-placeholder-val="{{ false }}"><a href="{{href}}" class="tt-ext" style="align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.02em; color: #1D1D1B; text-decoration: underline; text-underline-offset: 4px">{{linkShort}}</a></sc-if>
<sc-if value="{{browsing}}" hint-placeholder-val="{{ false }}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #6B665E">{{eCount}} · {{eDate}}</span>
<p style="margin: 0; font-size: 19px; line-height: 1.32; font-weight: 500">“{{eNote}}”</p>
<span style="font-size: 15px; color: #6B665E">— {{eName}}</span>
<button type="button" class="tt-btn" onClick="{{startMark}}" style="align-self: flex-start; min-height: 40px; padding: 0 18px; background: #1D1D1B; color: #EFEBE4; border: 1.5px solid #1D1D1B; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; cursor: pointer">LEAVE YOUR MARK</button>
</sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 6px"><span style="width: 64px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #6B665E">SHAPE</span>
<sc-for list="{{bMotifs}}" as="m" hint-placeholder-count="8"><button type="button" onClick="{{m.pick}}" aria-label="{{m.name}}" aria-pressed="{{m.on}}" style="width: 32px; height: 32px; padding: 4px; background: #EFEBE4; border: 1.5px solid {{m.bd}}; border-radius: 6px; cursor: pointer"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 120 120" style="display: block"><path d="{{m.a}}" fill="#1D1D1B" fill-rule="evenodd"></path><path d="{{m.b}}" fill="#1D1D1B" fill-opacity="0.5" fill-rule="evenodd"></path><path d="{{m.st}}" fill="none" stroke="#1D1D1B" stroke-width="16"></path></svg></button></sc-for></div>
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 62px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #6B665E">COLOUR</span>
<sc-for list="{{bColors}}" as="k" hint-placeholder-count="7"><button type="button" onClick="{{k.pick}}" aria-label="{{k.c}}" aria-pressed="{{k.on}}" style="width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 1px solid rgba(29,29,27,0.3); background: {{k.c}}; box-shadow: {{k.ring}}; cursor: pointer"></button></sc-for></div>
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 62px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #6B665E">GROUND</span>
<sc-for list="{{bGrounds}}" as="k" hint-placeholder-count="7"><button type="button" onClick="{{k.pick}}" aria-label="{{k.c}}" aria-pressed="{{k.on}}" style="width: 22px; height: 22px; padding: 0; border-radius: 4px; border: 1px solid rgba(29,29,27,0.3); background: {{k.c}}; box-shadow: {{k.ring}}; cursor: pointer"></button></sc-for></div>
<input type="text" aria-label="Your name" placeholder="Your name (optional)" maxlength="40" ref="{{nameRef}}" onInput="{{setName}}" onChange="{{setName}}" style="height: 34px; padding: 0; border: 0; border-bottom: 1px solid rgba(29,29,27,0.35); background: transparent; font-family: 'Familjen Grotesk', sans-serif; font-size: 16px; color: #1D1D1B; outline: none">
<textarea aria-label="Your note" placeholder="Leave a note…" maxlength="140" rows="2" ref="{{noteRef}}" onInput="{{setNote}}" onChange="{{setNote}}" style="padding: 6px 0; border: 0; border-bottom: 1px solid rgba(29,29,27,0.35); background: transparent; font-family: 'Familjen Grotesk', sans-serif; font-size: 16px; line-height: 1.3; color: #1D1D1B; resize: none; outline: none"></textarea>
<div style="display: flex; align-items: center; gap: 14px">
<button type="button" class="tt-btn" onClick="{{submitMark}}" style="min-height: 40px; padding: 0 18px; background: #1D1D1B; color: #EFEBE4; border: 1.5px solid #1D1D1B; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; cursor: pointer">SUBMIT MARK</button>
<button type="button" onClick="{{cancelMark}}" style="min-height: 40px; padding: 0; background: transparent; border: 0; font-family: 'Familjen Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: #6B665E; cursor: pointer">Cancel</button>
<span ref="{{leftRef}}" style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{leftColor}}">{{noteLeft}}</span>
</div>
</div>
</sc-if>
<sc-if value="{{showNav}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Pages" style="margin-top: auto; align-self: flex-end; width: 390px; flex-shrink: 0; padding-top: 12px; border-top: 1px solid rgba(29,29,27,0.25); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 14px">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="8"><button type="button" class="tt-nav" onClick="{{p.go}}" aria-current="{{p.cur}}" style="display: flex; align-items: baseline; gap: 8px; min-height: 30px; padding: 0; background: transparent; border: 0; text-align: left; font-family: 'Familjen Grotesk', sans-serif; font-size: 17px; font-weight: {{p.fw}}; letter-spacing: -0.01em; color: {{p.fg}}; cursor: pointer; white-space: nowrap"><span style="border-bottom: 1.5px solid {{p.ul}}; padding-bottom: 1px">{{p.label}}</span></button></sc-for>
</nav>
</sc-if>
</div>
<div aria-live="polite" style="position: absolute; left: 0; top: 810px; width: 270px; height: 90px; box-sizing: border-box; padding: 0 30px; background: #EFEBE4; display: flex; align-items: center; gap: 16px"><div aria-hidden="true" style="display: flex; flex-direction: column; gap: 4px"><sc-for list="{{ticks}}" as="k" hint-placeholder-count="3"><span class="tt-tick" style="display: block; width: 4px; height: {{k.h}}px; border-radius: 2px; background: {{k.c}}"></span></sc-for></div><div style="display: flex; flex-direction: column; gap: 3px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em"><span style="color: #1D1D1B; text-transform: uppercase">{{patName}}</span><span style="color: #8A857C">{{scrollHint}}</span></div></div>

</div>
</x-dc>
